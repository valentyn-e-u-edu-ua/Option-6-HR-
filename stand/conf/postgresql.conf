# =====================================================================
#  postgresql.conf — СТАРТОВА конфігурація стенда
#
#  !!! Ця конфігурація НАВМИСНО відтворює «недбалу» інсталяцію. !!!
#  Етап 1 практичної роботи — знайти й виправити слабкі місця.
#  Решту параметрів (TLS, pgaudit, журналювання) ви додаєте на етапах 4–5.
#
#  Після зміни:  SELECT pg_reload_conf();   (або docker compose restart db,
#  якщо параметр вимагає перезапуску — див. pg_settings.context)
# =====================================================================

# --- Файли ---
hba_file = '/etc/postgresql/conf/pg_hba.conf'

# --- З'єднання ---
listen_addresses = '*'
port = 5432
max_connections = 50

# --- Автентифікація ---
password_encryption = scram-sha-256

# --- Ресурси (для ноутбука) ---
shared_buffers = 128MB
dynamic_shared_memory_type = posix

# --- Журналювання ---
log_destination = 'stderr'
logging_collector = off
log_timezone = 'Europe/Kyiv'

# --- Локаль ---
timezone = 'Europe/Kyiv'
lc_messages = 'C'
datestyle = 'iso, dmy'
default_text_search_config = 'pg_catalog.simple'

superuser_reserved_connections = 3

authentication_timeout = 30s

idle_in_transaction_session_timeout = '10min'

log_connections = on

log_disconnections = on

log_line_prefix = '%m [%p] user=%u db=%d app=%a client=%h '

log_statement = 'ddl'

ssl = on
ssl_cert_file = '/etc/postgresql/certs/server.crt'
ssl_key_file  = '/etc/postgresql/certs/server.key'
ssl_ca_file   = '/etc/postgresql/certs/ca.crt'
ssl_min_protocol_version = 'TLSv1.3'

shared_preload_libraries = 'pgaudit'
pgaudit.log = 'read, write, ddl, role'
pgaudit.log_catalog = off